name: Deploy GetCryptoDomains Email Auth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: getcryptodomains-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python Worker dependencies
        run: uv sync

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_PEPPER: ${{ secrets.AUTH_EMAIL_PEPPER }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add CLOUDFLARE_API_TOKEN to this repository's Actions secrets." && exit 1)
          test -n "$RESEND_API_KEY" || (echo "::error::Add RESEND_API_KEY after creating a Resend API key." && exit 1)
          test -n "$AUTH_EMAIL_PEPPER" || (echo "::error::Add AUTH_EMAIL_PEPPER (generate with openssl rand -hex 32)." && exit 1)

      - name: Find or create D1 database, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc12ba22417960e78cd61eb57d04a60c
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_PEPPER: ${{ secrets.AUTH_EMAIL_PEPPER }}
        run: |
          set -euo pipefail

          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          DB_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const d=x.find(v=>v.name==="getcryptodomains-auth");if(d)process.stdout.write(d.uuid||d.database_id||"")')"

          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@4 d1 create getcryptodomains-auth --location enam
            npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
            DB_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const d=x.find(v=>v.name==="getcryptodomains-auth");if(d)process.stdout.write(d.uuid||d.database_id||"")')"
          fi

          test -n "$DB_ID" || (echo "::error::Could not find or create getcryptodomains-auth D1 database." && exit 1)
          DB_ID="$DB_ID" node -e 'const fs=require("fs");const p="wrangler.jsonc";const old=fs.readFileSync(p,"utf8");const next=old.replace("REPLACE_WITH_D1_DATABASE_ID",process.env.DB_ID);if(next===old)throw new Error("D1 ID placeholder missing");fs.writeFileSync(p,next)'

          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --name getcryptodomains-auth
          printf '%s' "$AUTH_EMAIL_PEPPER" | npx --yes wrangler@4 secret put AUTH_EMAIL_PEPPER --name getcryptodomains-auth

          npx --yes wrangler@4 d1 migrations apply getcryptodomains-auth --remote
          uv run pywrangler deploy
          curl --fail --silent --show-error https://auth.getcryptodomains.com/healthz
